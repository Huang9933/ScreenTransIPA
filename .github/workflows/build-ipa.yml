name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Xcode Project via XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build App without Validation
        run: |
          xcodebuild build \
            -project ScreenTrans.xcodeproj \
            -scheme ScreenTrans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "ScreenTrans.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r9 ScreenTrans_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTrans-IPA
          path: ScreenTrans_Unsigned.ipa
